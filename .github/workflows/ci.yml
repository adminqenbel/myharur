name: MyHarur CI & APK Release

# NOTE: Web deployment is handled by Render (env: docker, see render.yaml),
# NOT by this workflow. GitHub Pages deployment was removed — it was a
# third, uncoordinated deploy target with no injected credentials, running
# alongside Render and producing a separate broken build at a URL nobody
# was tracking. Render (now) -> Hostinger VPS (later, same Docker image)
# is the single canonical web deployment path. This workflow's job is
# CI (analyze/test) + Android APK release artifacts only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ci-release"
  cancel-in-progress: false

jobs:
  build_test_and_release:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Widget & Unit Tests
        run: flutter test

      - name: Build Android APK (Release)
        # SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY must be set as GitHub
        # Actions repo secrets (Settings > Secrets and variables > Actions).
        # Without these, the APK builds successfully but every Supabase
        # call fails at runtime with no visible error — this was the
        # actual root cause of prior "broken app" builds.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret is not set. Add them in repo Settings > Secrets and variables > Actions before building a release APK."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk ./myharur.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myharur-android-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            ./myharur.apk
          retention-days: 90

      - name: Read version from pubspec.yaml
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Tagged per pubspec version + run number, so every build gets its
        # own release and old APKs stay downloadable for rollback. Bump
        # `version:` in pubspec.yaml before a release push.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "MyHarur ${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          make_latest: true
          generate_release_notes: true
          body: |
            Automated production build from commit `${{ github.sha }}`.

            ### 📱 Download Android App
            - **Universal APK:** [myharur.apk](https://github.com/adminqenbel/myharur/releases/latest/download/myharur.apk)
            - **Alternative Build:** [app-release.apk](https://github.com/adminqenbel/myharur/releases/latest/download/app-release.apk)
            - **Supported Android Versions:** Android 6.0 (Marshmallow) and higher
          files: |
            ./myharur.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

