name: MyHarur CI & APK Release

# NOTE: Web deployment is handled by Render (env: docker, see render.yaml),
# NOT by this workflow. GitHub Pages deployment was removed — it was a
# third, uncoordinated deploy target with no injected credentials, running
# alongside Render and producing a separate broken build at a URL nobody
# was tracking. Render (now) -> Hostinger VPS (later, same Docker image)
# is the single canonical web deployment path. This workflow's job is
# CI (analyze/test) + Android APK release artifacts only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ci-release"
  cancel-in-progress: false

jobs:
  build_test_and_release:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Widget & Unit Tests
        run: flutter test

      - name: Prepare release signing (optional)
        # Add these repo secrets once you have an upload keystore (see docs/RELEASE.md):
        #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        # Without them the build is signed with the debug key (fine for testing, rejected by Google Play).
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/upload-keystore.jks
            {
              echo "storeFile=../upload-keystore.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - release build will be debug-signed."
          fi

      - name: Build Android APK + App Bundle (Release)
        # SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are optional overrides: the app has the
        # production values built in. Set them as repo secrets only to point a build at
        # a different Supabase project.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          DEFINES=""
          [ -n "$SUPABASE_URL" ] && DEFINES="$DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && DEFINES="$DEFINES --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          # Obfuscated release: class and function names are scrambled in the shipped code. Keep build/symbols
          # (uploaded below) to decode crash stack traces later.
          flutter build apk --release --obfuscate --split-debug-info=build/symbols $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk ./myharur.apk
          if [ "$SIGNED" = "true" ]; then
            flutter build appbundle --release --obfuscate --split-debug-info=build/symbols $DEFINES
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myharur-android-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            ./myharur.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload debug symbols (needed to read obfuscated crash traces)
        uses: actions/upload-artifact@v4
        with:
          name: myharur-symbols-${{ github.sha }}
          path: build/symbols
          if-no-files-found: warn
          retention-days: 365

      - name: Read version from pubspec.yaml
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Tagged per pubspec version + run number, so every build gets its
        # own release and old APKs stay downloadable for rollback. Bump
        # `version:` in pubspec.yaml before a release push.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "MyHarur ${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          make_latest: true
          generate_release_notes: true
          body: |
            Automated production build from commit `${{ github.sha }}`.

            ### 📱 Download Android App
            - **Universal APK:** [myharur.apk](https://github.com/adminqenbel/myharur/releases/latest/download/myharur.apk)
            - **Alternative Build:** [app-release.apk](https://github.com/adminqenbel/myharur/releases/latest/download/app-release.apk)
            - **Supported Android Versions:** Android 6.0 (Marshmallow) and higher
          files: |
            ./myharur.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

