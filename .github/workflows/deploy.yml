name: Deploy to Production (Hostinger VPS)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/myharur
            # Pull latest changes
            git pull origin main
            
            # Bring infrastructure up, then apply the schema before starting API workers.
            docker-compose -f docker-compose.prod.yml up -d db redis
            docker-compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

            # Rebuild and restart application containers.
            docker-compose -f docker-compose.prod.yml up -d --build
            
            # Prune dangling images to save space
            docker image prune -f
            
            # Check Health
            sleep 10
            curl -f http://localhost/api/v1/health || exit 1
            echo "Deployment successful."
