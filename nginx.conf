server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;              # this server only serves static files

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /download.html {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /download.html =404;
    }

    # Zero-overhead health check endpoint for Render keep-alive pinger
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","uptime":"active","service":"myharur-web"}';
    }

    # Android APK downloads with forced attachment header
    location ~* \.apk$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Disposition 'attachment; filename="myharur.apk"' always;
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
    }

    # The app shell and its loader are NOT fingerprinted: they must revalidate on every visit,
    # otherwise people keep running an old build for weeks after a deploy.
    location ~* ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|version\.json|manifest\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Static assets change rarely; a week is a safe compromise (they are not fingerprinted either).
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|wasm|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
