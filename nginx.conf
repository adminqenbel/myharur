server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /download.html {
        try_files /download.html =404;
    }

    # Zero-overhead health check endpoint for Render keep-alive pinger
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","uptime":"active","service":"myharur-web"}';
    }

    # Android APK downloads with forced attachment header
    location ~* \.apk$ {
        add_header Content-Disposition 'attachment; filename="myharur.apk"';
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
