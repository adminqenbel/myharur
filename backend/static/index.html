<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Harur | The Town Operating System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #112240 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: -webkit-linear-gradient(45deg, #FFD700, #FDB931);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #8892B0;
            max-width: 500px;
            margin-bottom: 2rem;
        }
        .download-btn {
            background-color: #FFD700;
            color: #0A192F;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
            background-color: #FDB931;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            color: #8892B0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>My Harur</h1>
    <p>The definitive digital operating system for Harur Town. Stay connected, get emergency assistance, and explore local shops.</p>
    <a href="/app-release.apk" class="download-btn">⬇ Download Android App</a>
    
    <div class="footer">
        &copy; 2026 My Harur Platform. Powered by Qenbel.
    </div>
</body>
</html>
