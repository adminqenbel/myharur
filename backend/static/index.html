<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My MyHarur | The Town Operating System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: url('/img/bg.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 47, 0.7); /* Dark overlay */
            backdrop-filter: blur(5px);
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            margin-top: 0;
            background: -webkit-linear-gradient(45deg, #FFD700, #FDB931);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.3rem;
            color: #E2E8F0;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }
        .download-btn {
            background: linear-gradient(135deg, #FFD700, #FDB931);
            color: #0A192F;
            padding: 16px 36px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .download-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <h1>MyHarur</h1>
        <p>The definitive digital operating system for Dharmapuri & Harur. Stay connected with live news, get emergency assistance, and explore local shops.</p>
        <a href="/myharur.apk" class="download-btn">⬇ Download Android App</a>
    </div>
    
    <div class="footer">
        &copy; 2026 MyHarur Platform. Powered by Qenbel.
    </div>
</body>
</html>
