<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHarur Beta testing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ED;
            --apple-bg: #f5f5f7;
            --apple-text: #1d1d1f;
            --apple-text-secondary: #86868b;
            --card-bg: #ffffff;
        }
        
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .beta-tag {
            color: #d9534f;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0 0 1rem 0;
            line-height: 1.1;
        }

        p.subtitle {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--apple-text-secondary);
            margin-bottom: 3rem;
            line-height: 1.4;
            max-width: 600px;
        }

        .download-btn {
            background-color: var(--apple-blue);
            color: #ffffff;
            padding: 16px 32px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 980px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .download-btn:hover {
            background-color: var(--apple-blue-hover);
            transform: scale(1.02);
        }
        
        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .footer {
            margin-top: 4rem;
            color: var(--apple-text-secondary);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            p.subtitle { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="beta-tag">Beta Release</div>
        <h1>MyHarur Beta testing</h1>
        <p class="subtitle">Experience the next generation of hyperlocal networking. Simple. Fast. Built for your town.</p>
        
        <a href="/myharur-beta.apk" class="download-btn">
            <svg viewBox="0 0 24 24"><path d="M16.59 9H15V4c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v5H7.41c-.89 0-1.34 1.08-.71 1.71l4.59 4.59c.39.39 1.02.39 1.41 0l4.59-4.59c.63-.63.19-1.71-.7-1.71zM5 19c0 .55.45 1 1 1h12c.55 0 1-.45 1-1s-.45-1-1-1H6c-.55 0-1 .45-1 1z"/></svg>
            Download Beta APK
        </a>
        
        <div class="footer">
            &copy; 2026 MyHarur Platform. All rights reserved.
        </div>
    </div>
</body>
</html>
