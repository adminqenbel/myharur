<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHarur | The Super App for Your Town</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #FDB931;
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: url('/img/bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: var(--bg-dark); /* fallback */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85); /* Darker, slightly blue overlay */
            backdrop-filter: blur(12px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 800px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .glass-card {
            background: var(--glass-bg);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            box-sizing: border-box;
        }

        .logo-tag {
            background: rgba(255, 215, 0, 0.15);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 20px rgba(255, 255, 255, 0.1);
        }

        h1 span {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 2.5rem;
        }

        .feature-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #e2e8f0;
            transition: all 0.3s ease;
        }

        .feature-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #0f172a;
            padding: 18px 40px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .download-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4);
        }
        
        .download-btn svg {
            width: 24px;
            height: 24px;
        }

        .footer {
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .glass-card { padding: 30px 20px; }
            .features-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        
        <div class="glass-card">
            <div class="logo-tag">Available Now</div>
            <h1>My<span>Harur</span></h1>
            <p class="subtitle">The definitive Hyperlocal Super App for Dharmapuri & Harur. Everything your town has to offer, right in your pocket.</p>
            
            <div class="features-grid">
                <div class="feature-badge">📰 Live Town Feed</div>
                <div class="feature-badge">🛍️ Daily Deals</div>
                <div class="feature-badge">💼 Jobs Nearby</div>
                <div class="feature-badge">🚨 Citizen SOS</div>
                <div class="feature-badge">📊 Local Polls</div>
                <div class="feature-badge">📈 Live Gold Rates</div>
            </div>

            <a href="/myharur.apk" class="download-btn">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M16.59 9H15V4c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v5H7.41c-.89 0-1.34 1.08-.71 1.71l4.59 4.59c.39.39 1.02.39 1.41 0l4.59-4.59c.63-.63.19-1.71-.7-1.71zM5 19c0 .55.45 1 1 1h12c.55 0 1-.45 1-1s-.45-1-1-1H6c-.55 0-1 .45-1 1z"/></svg>
                Download APK
            </a>
        </div>
        
        <div class="footer">
            &copy; 2026 MyHarur Platform. Powered by Qenbel.
        </div>
    </div>
</body>
</html>
