services:
  - type: web
    name: qenbel
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLIENT_ID
        value: 976428818123-abv9j8joclbmdr9i26vh0vgk0bj285js.apps.googleusercontent.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_PRIVATE_KEY_PEM
        sync: false
      - key: JWT_PUBLIC_KEY_PEM
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: qenbel-redis
          property: connectionString

  - type: redis
    name: qenbel-redis
    region: singapore
    plan: starter
    ipAllowList: []
