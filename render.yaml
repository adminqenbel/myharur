services:
  - type: web
    name: myharur-web
    env: docker
    region: oregon
    plan: free            # Free tier — pinged every 10 min by QenBel keep-alive cron
    dockerfilePath: ./Dockerfile
    # Docker Build Args: forward env vars as build-time --dart-define values
    # Set these in Render Dashboard > myharur-web > Environment
    dockerBuildArgs:
      - key: SUPABASE_URL
        fromEnvVar: SUPABASE_URL
      - key: SUPABASE_PUBLISHABLE_KEY
        fromEnvVar: SUPABASE_PUBLISHABLE_KEY
    envVars:
      - key: SUPABASE_URL
        sync: false   # set in Render dashboard, not committed to git
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
