services:
  - type: web
    name: myharur-web
    env: docker
    dockerfilePath: ./Dockerfile
    # Same image works unmodified when moved to Hostinger VPS later —
    # Render just runs `docker build` + `docker run` against it.
    envVars:
      - key: SUPABASE_URL
        sync: false   # set in Render dashboard, not committed to git
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
