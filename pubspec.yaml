name: myharur
description: A trusted digital-town app for Harur and Dharmapuri.
publish_to: none
version: 1.0.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  supabase_flutter: ^2.10.3
  url_launcher: ^6.3.1
  http: ^1.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/
