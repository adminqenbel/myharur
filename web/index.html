  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    html, body {
      background-color: #F8FAF9;
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'SF Pro Display', Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-icon {
      width: 78px;
      height: 78px;
      background: linear-gradient(135deg, #007F63 0%, #004D3C 100%);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 127, 99, 0.3);
      animation: pulseGlow 2.4s infinite ease-in-out;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }
    .brand-icon svg {
      width: 42px;
      height: 42px;
      fill: #FFFFFF;
    }
    .brand-title {
      margin-top: 20px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.8px;
      color: #15211F;
    }
    .brand-subtitle {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: #007F63;
    }
    .spinner-bar {
      margin-top: 28px;
      width: 52px;
      height: 4px;
      background-color: #E2ECE8;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .spinner-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 40%;
      background: #007F63;
      border-radius: 4px;
      animation: progressSweep 1.2s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 16px 36px rgba(0, 127, 99, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 20px 48px rgba(0, 127, 99, 0.45);
      }
    }
    @keyframes progressSweep {
      0% { left: -40%; width: 30%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <div class="brand-title">myharur</div>
    <div class="brand-subtitle">digital town</div>
    <div class="spinner-bar"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
